name: CI

# Runs on every push and PR: typecheck, lint, the real Vitest suite
# (against an ephemeral Postgres service — spun up fresh for this run,
# migrated, then discarded; never the real Neon dev/prod database), a
# production build, and the Playwright e2e suite against that build
# (`next start`, not `next dev` — see playwright.config.ts's own comment
# on why CI runs a production server instead). The build step itself
# still doesn't need a *reachable* database on its own (nothing in this
# repo performs a build-time DB query — no generateStaticParams, no
# top-level `dynamic` overrides; every page is request-time dynamic
# behind a real session cookie check), but DATABASE_URL now points at a
# real one anyway since the service is already up for the test/e2e steps.
#
# Finding #24: every action below is pinned to a full commit SHA with the
# release it came from in a trailing comment, rather than to a major tag.
# A tag like `@v4` is a moving pointer its maintainer (or anyone who
# compromises that account) can repoint at any commit, so `@v4` in this
# file is not a promise about what actually ran. Renovate/Dependabot is
# off, so the SHA will not move on its own — bumping one of these is a
# deliberate edit, and the three are on current majors
# (checkout v7.0.1, setup-node v7.1.0, cache v6.1.0).
#
# The job also declares its own token permissions instead of inheriting the
# repository default, which on an older repo is still read/write — see
# `permissions` below.

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege. Everything this workflow does with the GitHub API is
# read-only: checkout fetches the repo, setup-node and cache talk to their
# own services under the runtime token, not this one. A compromised action,
# or a step added by a fork's pull request, gets a token that can read this
# repository and nothing else — where the default would have let it push.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://circuit:circuit@localhost:5432/circuit_test"
      # schema.prisma's datasource reads directUrl too; against the CI service container it is the same database.
      DIRECT_URL: "postgresql://circuit:circuit@localhost:5432/circuit_test"
      JWT_SECRET: "ci-placeholder-secret-do-not-use-in-production"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      # The webhook-signature unit tests need real (if fake) values —
      # PAYSTACK_SECRET_KEY/FLUTTERWAVE_SECRET_HASH deliberately fail
      # closed when unset, which is exactly what those tests assert on
      # too, so each test sets/restores its own value rather than relying
      # on this — this is just so nothing else that happens to read them
      # at import time throws.
      PAYSTACK_SECRET_KEY: "ci-placeholder-paystack-key"
      FLUTTERWAVE_SECRET_HASH: "ci-placeholder-flutterwave-hash"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: circuit
          POSTGRES_PASSWORD: circuit
          POSTGRES_DB: circuit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Generate Next.js route types
        # tsc alone fails on a fresh checkout without this: `LayoutProps`/
        # `PageProps` are Next-codegenned ambient types written to
        # `.next/types/` the first time `next dev` or `next build` runs —
        # verified by reproducing the failure in a clean worktree with no
        # prior `.next/` directory.
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npx eslint .

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        # Skipped above when the browser cache hits (nothing to install
        # against), but the OS-level shared libraries Chromium needs
        # still have to be present on every fresh runner regardless.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E test
        run: npm run test:e2e
